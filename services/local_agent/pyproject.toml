[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-study-local-agent"
version = "0.1.13"
requires-python = ">=3.9"
dependencies = [
  "cryptography==45.0.6",
  "dashscope==1.27.2",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "onnxruntime==1.19.2",
  "pypdfium2==5.14.0",
  "opencv-python==4.10.0.84",
  "rapidocr==3.9.2",
  "sherpa-onnx==1.13.6",
  "tokenizers==0.21.4",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "tzdata==2026.3",
  "webrtcvad-wheels==2.0.14"
]

[project.optional-dependencies]
dev = [
  "pyinstaller==6.16.0",
  "pytest==8.4.1",
  "pytest-xdist==3.8.0"
]

[project.scripts]
home-study-local-agent = "home_study_agent.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
