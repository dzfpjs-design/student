<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>原子知识图谱审核</title>
  <style>
    :root{color-scheme:light;--ink:#11223e;--muted:#5f6d82;--line:#dbe3ef;--paper:#f6f8fc;--navy:#12345b;--blue:#236ee7;--orange:#f59e0b;--red:#dc4c64;--green:#11866b;--purple:#7c3aed}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #cad5e5;border-radius:8px;background:#fff;color:var(--ink);padding:8px 11px;font-weight:650}button:hover{border-color:var(--blue);color:var(--blue)}button.primary{background:var(--blue);border-color:var(--blue);color:white}.danger{color:#b4233a}.shell{max-width:1600px;margin:auto;padding:20px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:16px}.top h1{font-size:24px;margin:0}.top p{margin:4px 0 0;color:var(--muted)}.privacy{background:#eef6ff;border:1px solid #cfe4ff;border-radius:8px;padding:8px 12px;color:#1a4f86;font-size:12px}.filters,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filters{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.filters label{display:grid;gap:3px;font-size:12px;color:var(--muted)}select{min-width:130px;border:1px solid #cbd5e1;border-radius:7px;padding:7px;background:white;color:var(--ink)}.layout{display:grid;grid-template-columns:minmax(460px,1.1fr) minmax(390px,.9fr);gap:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:15px;margin:0}.hint{color:var(--muted);font-size:12px}.graph-wrap{height:480px;overflow:auto;background:linear-gradient(#fbfdff,#f5f9ff)}svg{min-width:800px;width:100%;height:480px}.edge{stroke:#9aacbe;stroke-width:1.4;fill:none;marker-end:url(#arrow)}.edge.prerequisite_of{stroke:var(--orange)}.edge.part_of,.edge.contains{stroke:var(--purple)}.edge.related_to,.edge.contrasts_with{stroke:var(--green)}.node rect{fill:#fff;stroke:#aebed2;stroke-width:1.3;rx:8}.node:hover rect,.node.active rect{stroke:var(--blue);stroke-width:2;fill:#eff6ff}.node text{font-size:11px;pointer-events:none;fill:#162c4b}.node small{fill:var(--muted)}.legend{padding:9px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:999px;margin-right:3px}.details{padding:14px;max-height:680px;overflow:auto}.empty{color:var(--muted);padding:18px}.status{border-radius:999px;padding:2px 7px;font-size:12px;font-weight:700;background:#edf2f7}.status.approved{background:#dcfce7;color:#166534}.status.rejected{background:#fee2e2;color:#991b1b}.status.needs_merge,.status.needs_correction{background:#fef3c7;color:#92400e}.detail-title{font-size:19px;margin:0 0 3px}.meta{color:var(--muted);font-size:12px;margin:0 0 12px}.section{border-top:1px solid var(--line);padding:12px 0}.section h3{font-size:13px;margin:0 0 7px}.section p{margin:4px 0}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.card{border:1px solid var(--line);background:#fbfdff;border-radius:8px;padding:8px}.card b{font-size:12px}.quote{border-left:3px solid #93c5fd;background:#f4f9ff;margin:8px 0;padding:8px;white-space:pre-wrap}.evidence{font-size:12px;border-top:1px solid #eef2f7;padding:8px 0}.evidence:first-child{border-top:0}.queue{grid-column:1/-1}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 14px;border-bottom:1px solid var(--line)}.tab.active{background:#e8f0ff;border-color:#89aef5;color:#164ca4}.queue-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px;padding:12px}.queue-item{border:1px solid var(--line);border-radius:9px;padding:10px}.queue-item h3{font-size:14px;margin:0 0 3px}.queue-item p{margin:4px 0;color:var(--muted);font-size:12px}.message{min-height:20px;color:var(--green);font-size:12px}.dialog{position:fixed;inset:0;display:none;place-items:center;background:#10203977;padding:20px}.dialog.open{display:grid}.dialog-box{max-width:520px;width:100%;background:#fff;border-radius:12px;padding:16px;box-shadow:0 12px 48px #001a3b55}.dialog h2{font-size:17px;margin:0 0 8px}.dialog textarea{width:100%;min-height:92px;border:1px solid #cbd5e1;border-radius:8px;padding:8px}.dialog input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px;margin:7px 0}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}@media(max-width:940px){.shell{padding:12px}.top{align-items:flex-start;flex-direction:column;gap:8px}.layout{grid-template-columns:1fr}.graph-wrap{height:400px}.queue{grid-column:auto}.grid3{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div><h1>原子知识图谱审核</h1><p>面向家长与研发审核当前全量构建结果；按需加载，不一次渲染全图。</p></div><div class="privacy">本地运行 · 构建库只读 · 不上传教材、视频或家庭数据</div></header>
  <section class="filters" aria-label="图谱筛选"><label>年级<select id="grade"><option value="">全部</option></select></label><label>学科<select id="subject"><option value="">全部</option></select></label><label>教材章节<select id="chapter"><option value="">全部</option></select></label><label>知识点状态<select id="status"><option value="">全部</option></select></label><button class="primary" id="apply">应用筛选</button><button id="reset">重置</button><span class="message" id="message"></span></section>
  <section class="layout">
    <section class="panel"><header class="panel-head"><div><h2>知识点关系图</h2><span class="hint" id="graphCount">加载中…</span></div><div class="actions"><button id="more">加载下一页</button><button id="neighborhood" disabled>加载所选节点邻域</button></div></header><div class="graph-wrap"><svg id="graph" role="img" aria-label="有方向的原子知识图谱"></svg></div><div class="legend"><span><i class="dot" style="background:#f59e0b"></i>prerequisite_of</span><span><i class="dot" style="background:#7c3aed"></i>part_of / contains</span><span><i class="dot" style="background:#11866b"></i>related / contrasts</span><span>箭头方向：前置或组成项 → 依赖/整体项</span></div></section>
    <aside class="panel"><header class="panel-head"><h2>节点审核详情</h2><span class="hint">定义、边界、证据与关系</span></header><div id="details" class="details"><p class="empty">点击图中的知识点，查看可审核的真实定义与来源证据。</p></div></aside>
    <section class="panel queue"><header class="panel-head"><div><h2>质量审核队列</h2><span class="hint">候选重复、孤立、循环、缺失证据与待审核</span></div><button id="refreshQueue">刷新队列</button></header><nav class="tabs" id="queueTabs" aria-label="审核队列分类"></nav><div id="queueItems" class="queue-items"></div></section>
  </section>
</main>
<div class="dialog" id="dialog" role="dialog" aria-modal="true"><form class="dialog-box" id="decisionForm"><h2 id="dialogTitle">保存审核决定</h2><p class="hint" id="dialogHint"></p><input id="reviewer" required value="本地审核者" maxlength="80" aria-label="审核人"><textarea id="note" placeholder="审核理由（可选；合并建议/关系纠正请说明目标或正确方向）" maxlength="1000"></textarea><div class="dialog-foot"><button type="button" id="cancel">取消</button><button class="primary" type="submit">持久化决定</button></div></form></div>
<script>
const state={options:null,nodes:[],edges:[],cursor:null,selected:null,queue:'pending',decision:null};
const candidateServices=['http://127.0.0.1:8765','http://127.0.0.1:8766'];
let apiRoot='';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(path,init)=>{const r=await fetch(apiRoot+path,init);const b=await r.json();if(!r.ok)throw Error(b.error||'请求失败');return b};
function filters(){return new URLSearchParams([...['grade','subject','chapter','status'].map(k=>[k,$(k).value]).filter(([,v])=>v)])}
function status(status){return `<span class="status ${esc(status)}">${esc(status)}</span>`}
function populate(id,items){$(id).insertAdjacentHTML('beforeend',items.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(''))}
async function connectService(){if(location.protocol!=='file:')return true;for(const origin of candidateServices){try{const response=await fetch(origin+'/api/health');if(response.ok){location.replace(origin+'/');return false}}catch{}}showConnectionError();return false}
function showConnectionError(){['grade','subject','chapter','status','apply','reset','more','neighborhood','refreshQueue'].forEach(id=>$(id).disabled=true);$('graphCount').textContent='本地数据服务未启动';$('graph').innerHTML='<text x="28" y="54" fill="#5f6d82">请先运行审核器，再点击下方重试。</text>';$('message').innerHTML='运行 <code>python3 services/local_agent/atomic_graph_review_server.py --open</code> 后，<button id="retryConnection" type="button">重试连接</button>';$('retryConnection').onclick=()=>location.reload()}
async function init(){if(!await connectService())return;state.options=await api('/api/options');populate('grade',state.options.grades);populate('subject',state.options.subjects);populate('chapter',state.options.chapters);populate('status',state.options.statuses);await loadGraph();renderTabs();await loadQueue()}
async function loadGraph({append=false,focus=null}={}){const q=filters();if(append&&state.cursor)q.set('cursor',state.cursor);if(focus)q.set('focus',focus);q.set('limit','50');const page=await api('/api/graph?'+q);state.nodes=append?[...state.nodes,...page.nodes]:page.nodes;state.edges=append?[...state.edges,...page.edges]:page.edges;state.cursor=page.next_cursor;$('more').disabled=!state.cursor;$('graphCount').textContent=`当前加载 ${state.nodes.length} 个节点、${state.edges.length} 条关系${focus?'（所选邻域）':''}`;renderGraph()}
function renderGraph(){const svg=$('graph'), nodes=state.nodes, pos=new Map();const cols=5,w=156,h=68;nodes.forEach((n,i)=>pos.set(n.key,{x:24+(i%cols)*158,y:24+Math.floor(i/cols)*82}));const rows=Math.max(6,Math.ceil(nodes.length/cols));svg.setAttribute('viewBox',`0 0 820 ${Math.max(480,rows*84+30)}`);svg.setAttribute('height',Math.max(480,rows*84+30));svg.innerHTML=`<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#9aacbe"/></marker></defs>`+state.edges.map(e=>{const a=pos.get(e.source_key),b=pos.get(e.target_key);if(!a||!b)return '';const ax=a.x+w/2,ay=a.y+h/2,bx=b.x+w/2,by=b.y+h/2;return `<path class="edge ${esc(e.relation_type)}" d="M${ax},${ay} L${bx},${by}"><title>${esc(e.relation_type)} · ${Math.round(e.confidence*100)}%</title></path>`}).join('')+nodes.map(n=>{const p=pos.get(n.key),title=n.title.length>19?n.title.slice(0,18)+'…':n.title;return `<g class="node ${n.key===state.selected?'active':''}" data-key="${esc(n.key)}" tabindex="0" role="button"><title>${esc(n.title)} · ${esc(n.grade_band)} ${esc(n.subject)}</title><rect x="${p.x}" y="${p.y}" width="${w}" height="${h}"/><text x="${p.x+9}" y="${p.y+23}">${esc(title)}</text><text x="${p.x+9}" y="${p.y+42}" fill="#5f6d82">${esc(n.grade_band)} · ${esc(n.subject)}</text><text x="${p.x+9}" y="${p.y+58}" fill="#5f6d82">${esc(n.effective_status)} · ${Math.round(n.confidence*100)}%</text></g>`}).join('');svg.querySelectorAll('.node').forEach(n=>{n.onclick=()=>selectNode(n.dataset.key);n.onkeydown=e=>{if(e.key==='Enter')selectNode(n.dataset.key)}})}
async function selectNode(key){state.selected=key;$('neighborhood').disabled=false;renderGraph();const data=await api('/api/node?key='+encodeURIComponent(key));renderDetails(data)}
function evidenceList(items,type){if(!items.length)return '<p class="hint">当前构建结果没有此类证据。</p>';return items.map(e=>`<div class="evidence"><b>${esc(e.resource_title||e.source_ref||type)}</b> <span class="hint">${esc(e.evidence_role||e.match_method||'')} · ${Math.round((e.confidence??e.lexical_score??0)*100)}%</span><div class="quote">${esc(e.exact_quote||'')}</div><span class="hint">${esc(e.transcript_relative_path||'')} ${e.ordinal!==undefined?'· 段 '+e.ordinal:''}</span></div>`).join('')}
function renderDetails(data){const n=data.node;const diag=Object.entries(n.diagnostics).map(([k,v])=>`<div class="card"><b>${esc(k)}</b><p>${esc(v.task_family||'待补充')}</p><p class="hint">${esc(v.success_rule||'')}</p></div>`).join('');const rel=data.relations.slice(0,18).map(r=>`<div class="evidence"><b>${esc(r.source_title||'未知')} → ${esc(r.target_title||'未知')}</b> <span class="hint">${esc(r.relation_type)} · ${Math.round(r.confidence*100)}%</span><p>${esc(r.rationale)}</p><button data-relation="${esc(r.relation_id)}" data-status="${esc(r.decision.effective_status)}">审核这条关系</button></div>`).join('')||'<p class="hint">当前节点没有候选关系。</p>'; $('details').innerHTML=`<h2 class="detail-title">${esc(n.title)}</h2><p class="meta">${esc(n.grade_band)} · ${esc(n.subject)} · ${esc(n.atom_kind)} · 置信度 ${Math.round(n.confidence*100)}% ${status(n.decision.effective_status)}</p><div class="actions"><button class="primary" data-action="approved">批准</button><button class="danger" data-action="rejected">驳回</button><button data-action="merge_suggestion">合并建议</button><button data-action="relation_correction">关系纠正</button><button data-action="revert">撤销</button></div><section class="section"><h3>定义与能力边界</h3><p>${esc(n.observable_outcome)}</p><div class="card"><b>边界</b><p>${esc(n.boundary.context||'')}</p><p class="hint">不包含：${esc((n.boundary.exclusions||[]).join('；'))}</p></div></section><section class="section"><h3>三层诊断</h3><div class="grid3">${diag}</div></section><section class="section"><h3>掌握标准</h3>${Object.entries(n.mastery_criteria).map(([k,v])=>`<p><b>${esc(k)}：</b>${esc(v)}</p>`).join('')}</section><section class="section"><h3>视频逐字证据</h3>${evidenceList(data.evidence.video_transcript,'视频逐字稿')}</section><section class="section"><h3>教材页证据</h3>${evidenceList(data.evidence.textbook,'教材')}</section><section class="section"><h3>课标对齐</h3>${evidenceList(data.evidence.standards,'课标')}</section><section class="section"><h3>来源与候选关系</h3><p class="hint">来源方法：${esc(n.source_method)} · 模型：${esc(n.model_provider||'本地/人工')} ${esc(n.model_name||'')}</p>${rel}</section>`;$('details').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>openDecision('draft',n.canonical_signature,b.dataset.action,n.title));$('details').querySelectorAll('[data-relation]').forEach(b=>b.onclick=()=>openDecision('relation',b.dataset.relation,'relation_correction','关系：'+b.closest('.evidence').querySelector('b').textContent))}
function renderTabs(){$('queueTabs').innerHTML=[['pending','待审核项'],['duplicates','重复候选'],['isolated','孤立节点'],['cycles','循环'],['missing_evidence','缺失证据']].map(([k,t])=>`<button class="tab ${state.queue===k?'active':''}" data-queue="${k}">${t}</button>`).join('');$('queueTabs').querySelectorAll('button').forEach(b=>b.onclick=async()=>{state.queue=b.dataset.queue;renderTabs();await loadQueue()})}
async function loadQueue(){const data=await api('/api/queue?category='+state.queue+'&limit=30');$('queueItems').innerHTML=data.items.length?data.items.map(i=>`<article class="queue-item"><h3>${esc(i.title)}</h3><p>${esc(i.grade_band||'')} · ${esc(i.subject||'')} · ${esc(i.reason)}</p><p>置信度 ${Math.round((i.confidence||0)*100)}%</p><button data-queue-key="${esc(i.key)}">查看并审核</button></article>`).join(''):'<p class="empty">这个队列当前没有发现项目。</p>';$('queueItems').querySelectorAll('[data-queue-key]').forEach(b=>b.onclick=()=>selectNode(b.dataset.queueKey))}
function openDecision(entity_type,entity_key,action,title){state.decision={entity_type,entity_key,action,title};$('dialogTitle').textContent=`${action}：${title}`;$('dialogHint').textContent=action==='revert'?'撤销会恢复构建库原有的待审状态；历史事件仍保留。':'这项操作只写入应用知识库的审核事件，不修改构建库。';$('note').value='';$('dialog').classList.add('open');$('note').focus()}
$('decisionForm').onsubmit=async e=>{e.preventDefault();const d=state.decision;try{const result=await api('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...d,reviewer:$('reviewer').value,note:$('note').value,payload:{note:$('note').value},client_action_id:'atomic-review-'+crypto.randomUUID()})});$('dialog').classList.remove('open');$('message').textContent=`已持久化：${result.effective_status}。刷新或重启后会恢复。`;await loadGraph();if(state.selected)await selectNode(state.selected);await loadQueue()}catch(error){$('message').textContent='保存失败：'+error.message}};
$('cancel').onclick=()=>$('dialog').classList.remove('open');$('apply').onclick=()=>loadGraph();$('reset').onclick=()=>{['grade','subject','chapter','status'].forEach(k=>$(k).value='');loadGraph()};$('more').onclick=()=>loadGraph({append:true});$('neighborhood').onclick=()=>loadGraph({focus:state.selected});$('refreshQueue').onclick=loadQueue;init().catch(e=>{$('message').textContent='无法读取本地知识图谱：'+e.message});
</script>
</body></html>
